<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1710 520" width="1710" height="520" font-family="'Source Sans 3', 'Liberation Sans', Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b5346"/>
    </marker>
    <marker id="seta-ti" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8661f"/>
    </marker>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3b3226" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1710" height="520" fill="#ffffff"/>

  <!-- Faixas de legenda das etapas -->
  <g font-size="15" font-weight="700" letter-spacing="1.6" fill="#8a8173">
    <text x="170" y="58" text-anchor="middle">INSUMO</text>
    <text x="490" y="58" text-anchor="middle">ETAPA 1</text>
    <text x="810" y="58" text-anchor="middle">PRODUTO INTERMEDIÁRIO</text>
    <text x="1130" y="58" text-anchor="middle">ETAPA 2</text>
    <text x="1520" y="58" text-anchor="middle">ETAPA 3</text>
  </g>
  <line x1="40" y1="76" x2="1670" y2="76" stroke="#e7e1d6" stroke-width="2"/>

  <!-- Arestas principais -->
  <g stroke="#5b5346" stroke-width="2.6" fill="none" marker-end="url(#seta)">
    <line x1="302" y1="210" x2="354" y2="210"/>
    <line x1="622" y1="210" x2="674" y2="210"/>
    <line x1="942" y1="210" x2="994" y2="210"/>
  </g>
  <!-- TI prevalece -->
  <line x1="1262" y1="210" x2="1384" y2="210" stroke="#b8661f" stroke-width="3.4" marker-end="url(#seta-ti)"/>
  <g transform="translate(1323,176)">
    <rect x="-52" y="-16" width="104" height="30" rx="15" fill="#fdf1e4" stroke="#e9b98a" stroke-width="1.5"/>
    <text y="5" text-anchor="middle" font-size="15" font-weight="700" fill="#9a5214">TI prevalece</text>
  </g>

  <!-- Município -> Malha Básica (parcela fora de TI) -->
  <path d="M490,310 L490,440 Q490,470 520,470 L1490,470 Q1520,470 1520,440 L1520,316" stroke="#5b5346" stroke-width="2.6" stroke-dasharray="9 7" fill="none" marker-end="url(#seta)"/>
  <g transform="translate(1005,470)">
    <rect x="-250" y="-18" width="500" height="36" rx="18" fill="#ffffff" stroke="#d9d1c3" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-size="16" fill="#4a4237"><tspan font-weight="700">Município</tspan> responde pela parcela não coberta por TI de outra CR</text>
  </g>

  <!-- A: Insumo -->
  <g filter="url(#sombra)">
    <rect x="40" y="110" width="260" height="200" rx="16" fill="#f4f1eb" stroke="#cfc6b6" stroke-width="1.5"/>
  </g>
  <g transform="translate(170,152)" fill="none" stroke="#8a8173" stroke-width="2">
    <path d="M-26,-4 L0,-16 L26,-4 L0,8 Z" fill="#e7e1d6"/>
    <path d="M-26,4 L0,16 L26,4"/>
    <path d="M-26,12 L0,24 L26,12"/>
  </g>
  <text x="170" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#3b3226">Malha de setores</text>
  <text x="170" y="240" text-anchor="middle" font-size="21" font-weight="700" fill="#3b3226">censitários ajustada</text>
  <text x="170" y="280" text-anchor="middle" font-size="16" fill="#7a7163" font-style="italic">Figura 8</text>

  <!-- B: Etapa 1 - Município -->
  <g filter="url(#sombra)">
    <rect x="360" y="110" width="260" height="200" rx="16" fill="#e6f0e8" stroke="#7fae8a" stroke-width="1.8"/>
  </g>
  <rect x="360" y="110" width="260" height="8" rx="4" fill="#2f7a4a"/>
  <circle cx="400" cy="156" r="20" fill="#2f7a4a"/>
  <text x="400" y="163" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
  <text x="432" y="164" font-size="24" font-weight="800" fill="#1f5233">Município</text>
  <text x="490" y="212" text-anchor="middle" font-size="17" fill="#2f3d33">CR com maior</text>
  <text x="490" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#1f5233">PI × Área de setores</text>
  <line x1="400" y1="258" x2="580" y2="258" stroke="#b5d2bc" stroke-width="1.5"/>
  <text x="490" y="285" text-anchor="middle" font-size="16" fill="#4d6353">1 município → 1 CR</text>

  <!-- C: Produto intermediário -->
  <g filter="url(#sombra)">
    <rect x="680" y="110" width="260" height="200" rx="16" fill="#f4f1eb" stroke="#cfc6b6" stroke-width="1.5"/>
  </g>
  <g transform="translate(810,152)" stroke="#8a8173" stroke-width="2" fill="#e7e1d6">
    <path d="M-30,-18 L-10,-24 L10,-18 L30,-24 L30,18 L10,24 L-10,18 L-30,24 Z"/>
    <path d="M-10,-24 L-10,18 M10,-18 L10,24" fill="none"/>
  </g>
  <text x="810" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#3b3226">Malha intermediária</text>
  <text x="810" y="240" text-anchor="middle" font-size="21" font-weight="700" fill="#3b3226">por município</text>
  <text x="810" y="280" text-anchor="middle" font-size="16" fill="#7a7163" font-style="italic">Figura 9</text>

  <!-- D: Etapa 2 - Terra Indígena -->
  <g filter="url(#sombra)">
    <rect x="1000" y="110" width="260" height="200" rx="16" fill="#fcefe1" stroke="#e0a770" stroke-width="1.8"/>
  </g>
  <rect x="1000" y="110" width="260" height="8" rx="4" fill="#b8661f"/>
  <circle cx="1040" cy="156" r="20" fill="#b8661f"/>
  <text x="1040" y="163" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
  <text x="1072" y="164" font-size="24" font-weight="800" fill="#7f4210">Terra Indígena</text>
  <text x="1130" y="212" text-anchor="middle" font-size="17" fill="#4a3522">CR com a</text>
  <text x="1130" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#7f4210">maior área de sobreposição</text>
  <line x1="1040" y1="258" x2="1220" y2="258" stroke="#f0cba6" stroke-width="1.5"/>
  <text x="1130" y="285" text-anchor="middle" font-size="16" fill="#6b5340">entre a TI e os municípios</text>

  <!-- E: Etapa 3 - Malha Básica -->
  <g filter="url(#sombra)">
    <rect x="1390" y="110" width="260" height="200" rx="16" fill="#1f5233"/>
  </g>
  <circle cx="1430" cy="156" r="20" fill="#ffffff"/>
  <text x="1430" y="163" text-anchor="middle" font-size="20" font-weight="800" fill="#1f5233">3</text>
  <text x="1462" y="164" font-size="24" font-weight="800" fill="#ffffff">Malha Básica</text>
  <text x="1520" y="212" text-anchor="middle" font-size="17" fill="#d6e8db">recortes mais específicos</text>
  <text x="1520" y="238" text-anchor="middle" font-size="17" fill="#d6e8db">prevalecem sobre os gerais</text>
  <line x1="1440" y1="258" x2="1600" y2="258" stroke="#3f7a55" stroke-width="1.5"/>
  <text x="1520" y="285" text-anchor="middle" font-size="16" fill="#b9d6c2" font-style="italic">Figura 14</text>
</svg>
